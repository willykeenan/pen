<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KE Pen overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="ink" aria-label="Draw a red mark around the screen area for your AI"></canvas>
    <aside id="badge" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <strong id="badge-title">PEN · K&amp;E STUDIOS</strong>
      <span id="badge-detail">DRAW · release to send</span>
    </aside>
    <script src="renderer.js"></script>
  </body>
</html>
