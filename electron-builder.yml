appId: dev.kestudios.pen
productName: KE Pen
copyright: Copyright © 2026 William Keenan and K&E Studios
asar: true
npmRebuild: false

directories:
  output: dist/release
  buildResources: assets

files:
  - dist/desktop/**/*

extraResources:
  - from: dist/mcp-app/index.js
    to: mcp/index.js
  - from: README.md
    to: README.md
  - from: LICENSE
    to: LICENSE
  - from: PRIVACY.md
    to: PRIVACY.md
  - from: SECURITY.md
    to: SECURITY.md

artifactName: KE-Pen-${version}-${os}-${arch}.${ext}

# Electron fuses, flipped in every packaged build. The embedded MCP server is
# started as KE Pen's own executable in Node mode (ELECTRON_RUN_AS_NODE), so
# runAsNode stays on; every other way to run code as KE Pen is off. Hold to
# capture's Accessibility approval belongs to the helper, not to KE Pen, so
# running code as KE Pen never borrows it (docs/MIDDLE_HOLD_CAPTURE_THREAT_MODEL.md).
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

mac:
  appId: dev.kestudios.pen
  category: public.app-category.developer-tools
  icon: assets/Pen.icns
  # Signed by scripts/sign-mac.cjs after the fuses are flipped: ad hoc for
  # public CI builds, or the identity in KE_PEN_MAC_SIGN_IDENTITY. The hold
  # helper is signed first with its own identifier, then the whole bundle.
  identity: "-"
  sign: scripts/sign-mac.cjs
  target:
    - dmg
    - zip
  # Hold-to-capture helper: a universal binary beside the app executable, so
  # it lives outside the asar in a signed code location attributed to KE Pen.
  extraFiles:
    - from: dist/native/darwin/ke-pen-hold-helper
      to: MacOS/ke-pen-hold-helper

dmg:
  title: KE Pen ${version}

win:
  icon: assets/pen-icon.png
  target:
    - nsis
    - zip
  extraResources:
    - from: dist/native/win32-x64/ke-pen-hold-helper.exe
      to: hold/ke-pen-hold-helper.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  executableName: ke-pen
  icon: assets/pen-icon.png
  category: Development
  synopsis: Free visual pointing layer for MCP-capable AI assistants
  description: Draw around any screen region and let a local MCP-capable AI inspect the marked crop.
  target:
    - AppImage
    - deb
    - tar.gz
