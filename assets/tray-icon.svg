<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KE Pen menu bar glyph</title>
  <desc id="desc">Monochrome camera stencil for the macOS menu bar. Black with alpha only: shipped as a template image so the system recolors it for light and dark menu bars.</desc>
  <!-- Drawn extra-bold on the 1024 grid because it renders at 18 x 18 points.
       Geometry matches the Dock tile's camera so the two read as one mark. -->
  <g fill="none" stroke="#000" stroke-width="86" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 330 L430 250 h164 L656 330"/>
    <rect x="196" y="330" width="632" height="446" rx="96"/>
    <circle cx="512" cy="548" r="138"/>
  </g>
  <circle cx="512" cy="548" r="60" fill="#000"/>
</svg>
