<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KE Pen</title>
  <desc id="desc">A white camera stencil with a red ink stroke on a dark rounded tile, matching the K&amp;E Studios app-icon family.</desc>
  <defs>
    <linearGradient id="field" x1="140" y1="120" x2="884" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a21"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile: dark rounded square with a hairline lift, same family as the KE "&" icon -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#field)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="6"/>
  <g clip-path="url(#tile-clip)">
    <path d="M186 342h652M186 512h652M186 682h652M342 186v652M512 186v652M682 186v652"
          fill="none" stroke="#fff" stroke-opacity="0.03" stroke-width="2"/>
  </g>

  <!-- Camera stencil: white strokes only, no fills, so it reads as cut metal -->
  <g fill="none" stroke="#f4f2ec" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- viewfinder hump + body -->
    <path d="M400 348 L436 288 h152 L624 348"/>
    <rect x="266" y="348" width="492" height="342" rx="64"/>
    <!-- lens, double ring -->
    <circle cx="512" cy="516" r="108"/>
  </g>
  <circle cx="512" cy="516" r="44" fill="#f4f2ec"/>
  <!-- shutter dot, top right of the body -->
  <circle cx="686" cy="414" r="21" fill="#f4f2ec"/>

  <!-- The signature: one hand-drawn red ink stroke, the same ink the pen draws with -->
  <path d="M296 784 C 388 750, 452 818, 546 782 S 700 742, 736 776"
        fill="none" stroke="#ed5f48" stroke-width="34" stroke-linecap="round"/>
</svg>
