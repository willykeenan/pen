name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify shared contracts
        run: npm run check

      - name: Build desktop and MCP bundles
        run: npm run build

      - name: Verify exact MCP discovery surface
        run: npm run verify:bundle

      - name: Verify public release has no private KE access wiring
        run: npm run verify:public

  native-mac-contract:
    name: Legacy native macOS contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  package:
    name: Package · ${{ matrix.label }}
    needs: [contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-universal
            script: package:mac
            verify: darwin
          - os: windows-latest
            label: Windows-x64
            script: package:win
            verify: win32
          - os: ubuntu-latest
            label: Linux-x64
            script: package:linux
            verify: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build native installers
        run: npm run ${{ matrix.script }}
      - name: Verify packaged source has no private KE access wiring
        run: npm run verify:public
      - name: Boot packaged app on macOS or Windows
        if: runner.os != 'Linux'
        run: npm run verify:package -- ${{ matrix.verify }}
      - name: Boot packaged app on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root dist/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/release/linux-unpacked/chrome-sandbox
          xvfb-run --auto-servernum npm run verify:package -- linux
      - name: Write SHA-256 manifest
        run: npm run checksums
      - name: Record verified installer inventory
        shell: bash
        run: |
          shopt -s nullglob
          assets=(
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS-*.txt
          )
          test "${#assets[@]}" -ge 2
          printf '%s\n' "${assets[@]}"
