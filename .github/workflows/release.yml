name: Publish free release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create private draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft only after the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Notes follow the tag. A hard-coded filename silently publishes the
          # previous version's notes for every release after the one it names.
          notes=".github/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "KE Pen ${GITHUB_REF_NAME#v} — free for macOS, Windows, and Linux" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "KE Pen ${GITHUB_REF_NAME#v} — free for macOS, Windows, and Linux" \
              --generate-notes
          fi

  build:
    name: Release build · ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-universal
            script: package:mac
            verify: darwin
          - os: windows-latest
            label: Windows-x64
            script: package:win
            verify: win32
          - os: ubuntu-latest
            label: Linux-x64
            script: package:linux
            verify: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }}
      - name: Boot packaged app on macOS or Windows
        if: runner.os != 'Linux'
        run: npm run verify:package -- ${{ matrix.verify }}
      - name: Boot packaged app on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root dist/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/release/linux-unpacked/chrome-sandbox
          xvfb-run --auto-servernum npm run verify:package -- linux
      - run: npm run checksums
      - name: Upload this platform directly to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS-*.txt
          )
          test "${#assets[@]}" -ge 2
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  release:
    name: Publish verified GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine checksums and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir release
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'SHA256SUMS-*.txt' \
            --dir release
          find release -name 'SHA256SUMS-*.txt' -type f -print0 \
            | xargs -0 cat \
            | sort -u \
            > release/KE-Pen-${GITHUB_REF_NAME#v}-SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" \
            release/KE-Pen-${GITHUB_REF_NAME#v}-SHA256SUMS.txt \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
