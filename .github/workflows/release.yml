name: Publish free release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Release build · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-universal
            script: package:mac
            verify: darwin
          - os: windows-latest
            label: Windows-x64
            script: package:win
            verify: win32
          - os: ubuntu-latest
            label: Linux-x64
            script: package:linux
            verify: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }}
      - name: Boot packaged app on macOS or Windows
        if: runner.os != 'Linux'
        run: npm run verify:package -- ${{ matrix.verify }}
      - name: Boot packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify:package -- linux
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS-*.txt

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Combine checksum manifests
        shell: bash
        run: |
          find release -name 'SHA256SUMS-*.txt' -type f -print0 \
            | xargs -0 cat \
            | sort -u \
            > release/KE-Pen-${GITHUB_REF_NAME#v}-SHA256SUMS.txt
      - name: Publish the completely free release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "KE Pen ${GITHUB_REF_NAME#v} — free for macOS, Windows, and Linux" \
            --generate-notes \
            release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.tar.gz release/KE-Pen-*-SHA256SUMS.txt
